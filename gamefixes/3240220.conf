# Grand Theft Auto V Enhanced (Steam AppID: 3240220)
# DirectX 12 Ultimate + Hardware Ray Tracing via D3DMetal (Apple Game Porting Toolkit 4.0 beta 3).
# NVAPI=1 exposes RTX 4090 identity and activates ngx-signer-patch so DLSS routes to MetalFX.
# -nobattleye bypasses BEDaisy.sys kernel anti-cheat deadlock for offline & story mode.
# Enables DirectStorage (dstorage / dstoragecore) and disables crashing overlays.
BACKEND=d3dmetal
NVAPI=1
D3DM_ENABLE_METALFX=1
ROSETTA_ADVERTISE_AVX=1
ARGS=-nobattleye
HIDE_WINE_EXPORTS=1
DLLOVERRIDES=EOSOVH-Win64-Shipping=d;EOSOverlayRenderer-Win64-Shipping=d;dstorage,dstoragecore=n,b

