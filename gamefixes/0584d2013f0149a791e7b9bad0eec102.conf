# Grand Theft Auto V Legacy (Epic Games Store: 0584d2013f0149a791e7b9bad0eec102)
# DirectX 11 via DXMT Metal translation backend.
# rockstar-shim/ stages version.dll to apply Chromium switches for CEF Social Club windows.
# -nobattleye bypasses BEDaisy.sys kernel anti-cheat deadlock for offline & story mode.
# Disables crashing Windows Epic overlays (EOSOVH / EOSOverlayRenderer).
BACKEND=dxmt
ROCKSTAR_SHIM=1
ARGS=-nobattleye
HIDE_WINE_EXPORTS=1
DLLOVERRIDES=EOSOVH-Win64-Shipping=d;EOSOverlayRenderer-Win64-Shipping=d;version=n,b

